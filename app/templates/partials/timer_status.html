<div id="timer-status" class="flex items-center justify-between bg-indigo-950/50 border border-indigo-500/30 rounded-xl px-4 py-2.5 text-xs text-indigo-200 animate-fadeIn">
    <div class="flex items-center space-x-2.5">
        <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <div class="flex items-center space-x-1.5">
            <span class="text-slate-400">Timer active:</span>
            <span class="font-bold text-white">{{ task_name }}</span>
            <span class="font-mono text-indigo-300">({{ duration_minutes }} min)</span>
        </div>
    </div>
    <form hx-post="/sessions" hx-target="#sessions-list" hx-swap="outerHTML" class="inline">
        <input type="hidden" name="task_name" value="{{ task_name }}">
        <input type="hidden" name="duration_minutes" value="{{ duration_minutes }}">
        <input type="hidden" name="energy_rating" value="4">
        <button type="submit" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/30 transition-all flex items-center space-x-1" title="Record this session as completed">
            <svg class="w-3 h-3 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            <span>Record Complete</span>
        </button>
    </form>
</div>
